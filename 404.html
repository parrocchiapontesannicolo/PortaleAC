<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portale AC</title>
    <base href="/PortaleAC/" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <meta name="theme-color" content="#1D1D1D" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Raleway:wght@400;600;700&display=swap" rel="stylesheet" />
    <script>
        // Tema prima che parta Blazor: evita il lampo bianco (vedi TemaService)
        window.temaSistemaScuro = function () {
            return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        };
        try {
            var scelta = localStorage.getItem("darkMode");
            if (scelta === "1" || (scelta === null && window.temaSistemaScuro())) {
                document.documentElement.setAttribute("data-tema", "scuro");
            }
        } catch (e) { }
    </script>
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div class="boot-screen">
            <div class="boot-spinner"></div>
            <div>Caricamento…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Si è verificato un errore imprevisto.
        <a href="" class="reload">Ricarica</a>
        <a class="dismiss">✕</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
</body>

</html>
